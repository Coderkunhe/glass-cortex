# GlassCortex Nginx Configuration — Windows Server Deployment
# Phase 67 Batch 1 · Batch 4 (配置要点 + TLS 参考 + WebSocket 完善)
# Phase 67 B131: 修复 504 Gateway Timeout — / location 补充 proxy_read_timeout
#
# 安装：复制到 C:\apps\nginx\conf\nginx.conf
# 验证：.\nginx.exe -t
# 启动：cd C:\apps\nginx; .\nginx.exe    (首次前台启动)
#       或 Start-Service Nginx           (已注册为 NSSM 服务后 · 见 deploy\README.md §2.2)
# 重载：.\nginx.exe -s reload
# 停止：.\nginx.exe -s stop
#
# ══════ 配置要点（踩坑速查）══════
# ① /api/ proxy_pass 末尾斜杠 → 剥离 /api 前缀，FastAPI 路由是 /health 不是 /api/health
#    ✅ proxy_pass http://fastapi/;    ❌ proxy_pass http://fastapi;
# ② SSE 流式聊天必须关缓冲 → proxy_buffering off + proxy_read_timeout 300s
#    不关 → Token 被 nginx 攒着不吐出，30s 就断流
# ③ /_next/ WebSocket 升级头 → dev 模式 HMR 需要，生产 standalone 无害
# ④ TLS 只开 1.2+ → ssl_protocols TLSv1.2 TLSv1.3;（1.0/1.1 已被 IETF 弃用）
# ⑤ 上游端口不混淆 → fastapi = 8000 · nextjs = 3000

worker_processes auto;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log logs/access.log main;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # 上游服务定义
    upstream nextjs {
        server 127.0.0.1:3000;
    }

    upstream fastapi {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 请求体大小限制（大消息/日志查询）
        client_max_body_size 10m;

        # ── API 反向代理 → FastAPI (uvicorn) ──
        location /api/ {
            proxy_pass http://fastapi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / 流式响应支持（聊天管线需要）
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;

            # CORS 由 FastAPI 端处理，Nginx 不重复设置
        }

        # ── 前端 → Next.js ──
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（HMR / 实时更新）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时控制 — 防止 504 Gateway Timeout
            # SSR 页面（如 /learn）需要加载全量答案 + DOMPurify/jsdom 渲染，可能超过默认 60s
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ── 静态资源 + HMR (Next.js) ──
        location /_next/ {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;

            # WebSocket 升级（dev 模式 HMR 需要，生产 standalone 无害）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 静态资源可长期缓存（文件名带 hash）
            expires 1y;
            add_header Cache-Control "public, immutable";

            # 超时控制
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}

