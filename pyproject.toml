[project]
name = "glasscortex"
version = "0.1.0"
description = "GlassCortex — See How AI Remembers, Thinks, and Plans. 逐层解剖 AI Robot 工作原理。"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu",
    "sentence-transformers",
    "rich",
    "numpy",
    "openai",

    "plotly",
    "torchvision",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backups", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["backups/", "data/", "deploy-package/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
